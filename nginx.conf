map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The bearer token carries the user's permissions and can exceed nginx's 8 kB default.
  client_header_buffer_size 16k;
  large_client_header_buffers 8 64k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # API + realtime WebSocket: the api container runs in the same ECS task (localhost).
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 30m;
    add_header Cache-Control "no-store" always;
  }

  # Load balancer health check.
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  # Hashed bundles: cache for a year.
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Translations change without a hash in the name.
  location /assets/i18n/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # SPA: every other path is the app; never cache index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
