server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # Load balancer health check.
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  # Hashed bundles: cache for a year.
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Translations change without a hash in the name.
  location /assets/i18n/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # SPA: every other path is the app; never cache index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
