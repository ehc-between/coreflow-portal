<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CoreFlow</title>
    <base href="/" />
    <script>
      // Set <html lang> to the saved UI language before the app boots (screen readers,
      // hyphenation, native date inputs). LanguageService keeps it in step afterwards.
      try {
        var lang = localStorage.getItem('coreflow.lang');
        if (lang === 'nb' || lang === 'en')
          document.documentElement.lang = lang === 'nb' ? 'nb-NO' : 'en';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
