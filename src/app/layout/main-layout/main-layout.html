<div class="relative flex h-dvh w-full flex-col overflow-hidden bg-bg text-fg">
  <a href="#main-content" class="cf-skip-link" (click)="skipToContent($event)">{{
    'ui.shell.skipToContent' | transloco
  }}</a>

  <app-top-bar />

  <!-- pb-20 keeps the end of every page clear of the floating "Spør CoreFlow" button. -->
  <main
    id="main-content"
    tabindex="-1"
    class="min-h-0 min-w-0 flex-1 overflow-y-auto pb-20 outline-none"
  >
    @defer (when registrer.created()) {
      <app-registrer-complete />
    }
    <router-outlet />
  </main>

  @if (!ask.open()) {
    <button
      type="button"
      (click)="ask.show()"
      [attr.aria-label]="launcherLabel()"
      [title]="launcherTitle()"
      aria-keyshortcuts="Control+J Meta+J"
      data-testid="ask-launcher"
      class="fixed right-[max(16px,calc(env(safe-area-inset-right)+16px))] bottom-[max(16px,calc(env(safe-area-inset-bottom)+16px))] z-[30] flex h-12 w-12 items-center justify-center gap-2 rounded-full bg-accent font-semibold text-white shadow-pop hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:right-[max(20px,calc(env(safe-area-inset-right)+20px))] sm:bottom-[max(20px,calc(env(safe-area-inset-bottom)+20px))] sm:h-auto sm:w-auto sm:px-[18px] sm:py-3"
    >
      <span aria-hidden="true" class="text-[17px] leading-none">✦</span>
      <span class="hidden text-ui sm:inline">{{ 'ui.shell.ask' | transloco }}</span>
      @if (ask.streaming() || ask.hasConversation()) {
        <span
          class="absolute top-1 right-1 h-2.5 w-2.5 rounded-full border-2 border-surface bg-pass"
          [class.animate-ping]="ask.streaming()"
        ></span>
      }
    </button>
  }

  <app-notifications />
  <!-- Kept out of the initial bundle (X01): fetched once the page is idle, created the first time they open. -->
  @defer (when ask.open(); prefetch on idle) {
    <app-ask-panel />
  }
  @defer (when palette.open(); prefetch on idle) {
    <app-command-palette />
  }
  @defer (when registrer.open(); prefetch on idle) {
    <app-registrer-dialog />
  }
</div>
