<div class="relative flex min-h-screen items-center justify-center bg-bg px-4 text-fg">
  <div class="absolute top-4 right-4 flex items-center gap-1.5">
    <button
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="'theme.toggle' | transloco"
      class="flex h-9 w-9 items-center justify-center rounded-[9px] border border-transparent bg-transparent text-fg-muted hover:bg-surface-2 hover:text-fg"
    >
      <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
    </button>
    <app-language-switcher />
  </div>

  <div class="w-full max-w-sm">
    <div class="mb-6 flex items-center gap-2.5">
      <span
        class="flex h-[34px] w-[34px] items-center justify-center rounded-[10px] bg-[linear-gradient(135deg,var(--accent),var(--accent-2))] text-white shadow-[0_3px_10px_rgba(90,75,230,0.4)]"
      >
        <app-icon name="spark" [size]="20" />
      </span>
      <span class="font-display text-[22px] font-bold tracking-[-0.02em]">CoreFlow</span>
    </div>

    <app-card>
      <div class="p-2">
        <h1 class="font-display text-[22px] font-bold tracking-[-0.02em] text-fg">
          {{ 'login.title' | transloco }}
        </h1>
        <p class="mt-1 text-[13.5px] text-fg-muted">{{ 'login.subtitle' | transloco }}</p>

        <form class="mt-6 flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
          <app-form-field inputId="login-email" [label]="'auth.label.email' | transloco">
            <input id="login-email" type="email" formControlName="email" autocomplete="username" />
          </app-form-field>

          <app-form-field inputId="login-password" [label]="'auth.label.password' | transloco">
            <input
              id="login-password"
              type="password"
              formControlName="password"
              autocomplete="current-password"
            />
          </app-form-field>

          @if (failed()) {
            <p
              role="alert"
              class="rounded-tile border border-fail/30 bg-fail-soft px-3 py-2 text-[13px] font-medium text-fail"
            >
              {{ 'auth.error.invalidCredentials' | transloco }}
            </p>
          }

          <app-button type="submit" size="lg" [full]="true" [loading]="submitting()" class="mt-1">
            {{ (submitting() ? 'auth.action.signingIn' : 'auth.action.signIn') | transloco }}
          </app-button>
        </form>
      </div>
    </app-card>
  </div>
</div>
