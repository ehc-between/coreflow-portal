<div class="mx-auto max-w-[1180px] px-4 pt-6 pb-12 sm:px-8 sm:pt-7">
  <app-page-header titleKey="settings.hub.title" descriptionKey="settings.hub.description" />

  @if (!orgId()) {
    <app-card>
      <div class="px-2 py-8 text-center text-body text-fg-muted">
        {{ 'settings.noOrg' | transloco }}
      </div>
    </app-card>
  } @else {
    <div class="mb-6">
      <app-help-strip scope="platform" page="settings" />
    </div>

    @if (withoutLead().length > 0) {
      <a
        routerLink="/settings/departments"
        data-testid="settings-attention-leads"
        class="mb-6 flex items-start gap-2 rounded-tile border border-warn/30 bg-warn-soft px-3 py-2 text-ui text-warn-ink hover:underline"
      >
        <app-icon name="alert" [size]="15" />
        <span>{{
          countKey('settings.departments.noLeadWarning', withoutLead().length)
            | transloco
              : {
                  count: withoutLead().length,
                  names: withoutLeadNames(),
                }
        }}</span>
      </a>
    }

    <app-settings-links />
    <app-org-nav-settings />
    <app-home-workspace-settings />
  }
</div>
